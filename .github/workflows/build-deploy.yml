name: build-deploy

# Monta o fomenta.duckdb a partir das fontes oficiais, publica os dados numa
# Release e publica a branch `deploy`, que a Vercel (conta própria da API) põe no ar.
on:
  schedule:
    - cron: "0 9 * * 1"   # segunda, 06:00 em Brasília (a FINEP atualiza toda semana)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/**", "pipeline/**", "api/**", "vercel.json", "requirements*.txt"]

permissions:
  contents: write   # criar a Release de dados

concurrency:
  group: build-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - run: pip install -r requirements-pipeline.txt

      - name: Testes
        run: python -m pytest -q

      # Última coleta boa de cada fonte. Se o site da fonte falhar (já aconteceu com
      # o certificado da FINEP), o build segue com estes arquivos e a data de
      # posição na API mostra a idade real dos dados.
      - name: Fontes da última coleta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/cache/finep build/cache/capes
          gh release download fontes-finep -D build/cache/finep --clobber || echo "sem cache da FINEP"
          gh release download fontes-capes -D build/cache/capes --clobber || echo "sem cache da CAPES"

      # Retrato da plataforma (editais, congressos, PNIPE, sinergia, Elos), exportado do
      # Supabase do FomentaBR por tools/export_supabase_snapshot.py. Por enquanto, único.
      - name: Retrato da plataforma
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download snapshot-plataforma -D build/snapshot --clobber

      # Edições da newsletter já enviadas, do painel /admin do FomentaBR, para o arquivo público do
      # site. Sem o segredo FOMENTABR_ADMIN_TOKEN, ficam as que já estão no retrato.
      - name: Edições da newsletter
        env:
          FOMENTABR_ADMIN_TOKEN: ${{ secrets.FOMENTABR_ADMIN_TOKEN }}
        run: |
          if [ -z "$FOMENTABR_ADMIN_TOKEN" ]; then echo "Sem FOMENTABR_ADMIN_TOKEN; pulando."; exit 0; fi
          python tools/newsletter_fomentabr.py

      - name: Build dos dados (baixa FINEP e CAPES)
        run: python -m pipeline.build

      - name: Guardar as fontes desta coleta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for src in finep capes; do
            gh release view "fontes-$src" >/dev/null 2>&1 ||               gh release create "fontes-$src" --latest=false --title "Fontes: $src (última coleta)"                 --notes "Arquivos brutos da última coleta boa. Usados pelo build quando o site da fonte falha."
            gh release upload "fontes-$src" build/cache/$src/* --clobber
          done

      - name: Release de dados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dados-$(date -u +%Y-%m-%d)"
          FILES="build/fomenta.duckdb build/tabelas/*.parquet build/manifest.json build/parquet/*.parquet"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --title "Dados de $(date -u +%d/%m/%Y)" \
              --notes "Gerado pelo build-deploy. Posição de cada fonte em manifest.json."
          fi

      # A Vercel (ligada ao repositório pelo painel) publica a branch `deploy`.
      # Ela recebe só o que a função precisa — API, banco e respostas estáticas —
      # num commit único, reescrito a cada build: o histórico não acumula os
      # binários do banco.
      - name: Publicar a branch deploy
        run: |
          rm -rf /tmp/deploy && mkdir -p /tmp/deploy/build
          cp -r api requirements.txt vercel.json /tmp/deploy/
          cp -r build/fomenta.duckdb build/tabelas build/manifest.json build/static /tmp/deploy/build/
          echo '__pycache__/' > /tmp/deploy/.gitignore
          cd /tmp/deploy
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: dados de $(date -u +%Y-%m-%d) (código ${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" deploy

      # Avisos de editais novos (Web Push) para quem segue agências, laboratórios ou
      # pesquisadores no site. Sem os segredos VAPID e do Redis, o passo não faz nada.
      - name: Avisos de editais
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_CONTATO: ${{ secrets.VAPID_CONTATO }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          if [ -z "$VAPID_PRIVATE_KEY" ] || [ -z "$UPSTASH_REDIS_REST_URL" ]; then
            echo "Avisos não configurados (VAPID ou Redis); pulando."; exit 0
          fi
          python tools/notificar_editais.py enviar
